[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Rooomtech"
version = "0.3.0"
description = "A small-team friendly pure-Python vector database for RAG and Dify integration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "ROOOMTECH"}]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "numpy>=2.0",
  "pydantic>=2.8",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gpu = ["cupy-cuda12x>=13.0; platform_system == 'Linux'"]

[project.scripts]
rooomtech-vector = "rooomtech_vector.api:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
